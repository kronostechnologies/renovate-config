name: Renovate checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-renovate:
    name: Check Renovate files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: equisoft-actions/with-asdf-vm@v2
      - run: make check.renovate
